<meta name="description" content="Catálogo institucional de sistemas digitales. Explora, conoce y solicita los sistemas disponibles para tu dependencia.">
<style>
/* Diseño: barra lateral en escritorio y panel inferior anclado en teléfono.
   Contenido en estantes (carruseles, listas de filas con icono, fichas largas). Acento azul, iconos "squircle" con degradado. */
:root{
  --bg:#ffffff; --bg-soft:#f4f6f9; --bg-card:#f4f6f9; --bg-input:#ffffff;
  --label:#1d1d1f; --label-2:#6e6e73; --label-3:#8e8e93;
  --sep:rgba(60,60,67,.16); --sep-strong:rgba(60,60,67,.3);
  --accent:#0a64c8; --accent-ink:#ffffff; --accent-soft:rgba(10,100,200,.11);
  --pill:#eef1f6; --pill-ink:#0a64c8;
  --ok:#1f8a3b; --ok-soft:rgba(31,138,59,.12); --warn:#b25000; --warn-soft:rgba(255,149,0,.16); --bad:#d70015; --bad-soft:rgba(215,0,21,.1);
  --glass:rgba(255,255,255,.76); --sidebar:#f4f4f7; --sel:rgba(60,60,67,.1);
  --shadow:0 1px 2px rgba(0,0,0,.05),0 10px 30px rgba(0,0,0,.09);
  --shadow-pop:0 20px 60px rgba(0,0,0,.28);
  --scrim:rgba(0,0,0,.4);
  --font:"Segoe UI",Roboto,"Helvetica Neue",Arial,system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --gutter:40px;
}
@media (prefers-color-scheme: dark){
  /* Se conserva el tema claro solicitado */
  :root:not([data-theme="light"]){ color-scheme: light; }
  :root:not([data-theme="light"]){
    --bg:#000000; --bg-soft:#1c1c1e; --bg-card:#1c1c1e; --bg-input:#2c2c2e;
    --label:#f5f5f7; --label-2:#a1a1a6; --label-3:#8e8e93;
    --sep:rgba(84,84,88,.5); --sep-strong:rgba(120,120,128,.6);
    --accent:#4a9bf0; --accent-ink:#ffffff; --accent-soft:rgba(74,155,240,.18);
    --pill:#2c2c2e; --pill-ink:#4a9bf0;
    --ok:#32d74b; --ok-soft:rgba(50,215,75,.16); --warn:#ff9f0a; --warn-soft:rgba(255,159,10,.18); --bad:#ff453a; --bad-soft:rgba(255,69,58,.16);
    --glass:rgba(28,28,30,.76); --sidebar:#161618; --sel:rgba(255,255,255,.1);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.5);
    --scrim:rgba(0,0,0,.6); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --bg-soft:#1c1c1e; --bg-card:#1c1c1e; --bg-input:#2c2c2e;
  --label:#f5f5f7; --label-2:#a1a1a6; --label-3:#8e8e93;
  --sep:rgba(84,84,88,.5); --sep-strong:rgba(120,120,128,.6);
  --accent:#4a9bf0; --accent-ink:#ffffff; --accent-soft:rgba(74,155,240,.18);
  --pill:#2c2c2e; --pill-ink:#4a9bf0;
  --ok:#32d74b; --ok-soft:rgba(50,215,75,.16); --warn:#ff9f0a; --warn-soft:rgba(255,159,10,.18); --bad:#ff453a; --bad-soft:rgba(255,69,58,.16);
  --glass:rgba(28,28,30,.76); --sidebar:#161618; --sel:rgba(255,255,255,.1);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.5);
  --scrim:rgba(0,0,0,.6); color-scheme:dark;
}
@media (max-width:900px){:root{--gutter:16px}}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--label);font-family:var(--font);font-size:17px;line-height:1.47;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:disabled{cursor:not-allowed}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,p,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
img{max-width:100%;display:block}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 60%,transparent);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.g{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- Estructura ---------- */
.app{display:grid;grid-template-columns:262px minmax(0,1fr);min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--sidebar);border-right:1px solid var(--sep);padding:20px 14px 16px;display:flex;flex-direction:column;gap:16px}
.col{min-width:0;display:flex;flex-direction:column;min-height:100vh}
main{flex:1;width:100%;max-width:1100px;margin:0 auto;padding:0 var(--gutter) 72px;outline:none}
.foot{max-width:1100px;width:100%;margin:0 auto;padding:28px var(--gutter) 40px;color:var(--label-2);font-size:12.5px;border-top:1px solid var(--sep);display:flex;gap:6px 24px;flex-wrap:wrap;justify-content:space-between}
.brand{display:flex;gap:11px;align-items:center;color:var(--label);padding:2px 6px;border-radius:12px}
.brand:hover{text-decoration:none}
.brand .ico{--s:38px}
.brand b{display:block;font-size:15px;line-height:1.2;letter-spacing:-.015em}
.brand small{display:block;color:var(--label-2);font-size:12px;line-height:1.25;margin-top:2px}
.searchbox{display:flex;align-items:center;gap:8px;background:var(--sel);border-radius:10px;padding:0 10px;color:var(--label-2)}
.searchbox input[type=search]{flex:1;border:0;background:none;box-shadow:none;border-radius:0;min-width:0;border:0;background:none;outline:0;padding:8px 0;font-size:15px}
.searchbox input::placeholder{color:var(--label-3)}
.searchbox:focus-within{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 45%,transparent)}
.sidenav{display:flex;flex-direction:column;gap:2px}
.sidenav h6{margin:14px 10px 4px;font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--label-3)}
.sidenav a,.sidenav button{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;color:var(--label);font-size:15px;width:100%;text-align:left}
.sidenav a:hover,.sidenav button:hover{background:var(--sel);text-decoration:none}
.sidenav [aria-current="page"]{background:var(--sel);font-weight:600}
.sidenav .g{color:var(--accent)}
.sidenav .cdot{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,var(--c1),var(--c2));flex:none}
.sidenav .cdot .g{width:12px;height:12px;color:#fff;stroke-width:2.2}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding-top:10px;border-top:1px solid var(--sep)}
.side-foot .mode{font-size:12.5px;color:var(--label-2);padding:0 10px}

.tabbar{display:none;position:fixed;top:0;bottom:0;left:0;width:68px;z-index:40;flex-direction:column;align-items:stretch;gap:4px;padding:calc(14px + env(safe-area-inset-top,0px)) 6px calc(14px + env(safe-area-inset-bottom,0px));background:var(--glass);-webkit-backdrop-filter:saturate(160%) blur(20px);backdrop-filter:saturate(160%) blur(20px);border-right:1px solid var(--sep);border-radius:0 24px 24px 0;box-shadow:8px 0 30px rgba(0,0,0,.06);overflow-y:auto;scrollbar-width:none}
.tabbar::-webkit-scrollbar{display:none}
.tabbar::after{content:"";position:absolute;top:18px;bottom:18px;right:-1px;width:2px;border-radius:2px;background:linear-gradient(180deg,var(--accent),transparent 70%);opacity:.55;pointer-events:none}
.rail-brand{width:42px;height:42px;margin:0 auto 12px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,var(--accent),#2bb5a0);color:#fff;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.18);flex:none}
.rail-brand:hover{text-decoration:none}
.rail-brand img{width:100%;height:100%;object-fit:cover}
.rail-brand .g{width:22px;height:22px}

/* ---------- Iconos de sistema ---------- */
.ico{--s:64px;width:var(--s);height:var(--s);border-radius:27%;background:linear-gradient(150deg,var(--c1),var(--c2));display:grid;place-items:center;color:#fff;flex:none;position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08),0 1px 3px rgba(0,0,0,.12)}

.ico.s28{--s:28px}.ico.s34{--s:34px}.ico.s40{--s:40px}.ico.s48{--s:48px}.ico.s64{--s:64px}.ico.s96{--s:96px}.ico.s128{--s:128px}

}

.authwrap{min-height:100vh;display:grid;align-content:center;justify-items:center;gap:18px;padding:calc(24px + env(safe-area-inset-top,0px)) 18px calc(24px + env(safe-area-inset-bottom,0px));background:radial-gradient(900px 500px at 12% -10%,var(--accent-soft),transparent 60%),radial-gradient(700px 420px at 100% 110%,rgba(43,181,160,.14),transparent 60%)}
.authcard{width:min(440px,100%);background:var(--bg);border:1px solid var(--sep);border-radius:24px;padding:30px 24px 24px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.authcard::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,var(--accent),#2bb5a0)}
.auth-brand{display:flex;gap:12px;align-items:center;margin-bottom:20px}
.auth-logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;overflow:hidden;color:#fff;background:linear-gradient(145deg,var(--accent),#2bb5a0);flex:none}
.auth-logo img{width:100%;height:100%;object-fit:cover}.auth-logo .g{width:24px;height:24px}
.auth-brand b{display:block;font-size:16px;letter-spacing:-.015em;line-height:1.2}.auth-brand small{color:var(--label-2);font-size:13px}
.authcard h1{font-size:26px;line-height:1.15;font-weight:700;letter-spacing:-.025em}
.authcard .lede{font-size:15px;margin:6px 0 18px}
.authcard form{display:grid;gap:14px}
.authcard .btn.big{padding:13px 18px;font-size:16px;width:100%}
.auth-links{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:18px;font-size:14.5px}
.auth-links button{color:var(--accent);font-weight:600}
.auth-foot{color:var(--label-3);font-size:12.5px;text-align:center;max-width:440px}
.pwrow{position:relative}.pwrow input{padding-right:84px}
.showpw{position:absolute;right:6px;top:50%;transform:translateY(-50%);padding:6px 10px;font-size:13px;font-weight:600;color:var(--accent);border-radius:8px}
.avatar-i{width:40px;height:40px;border-radius:50%;background:linear-gradient(145deg,var(--accent),#2bb5a0);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
button.avatar{font:inherit;font-weight:700}
.tmp{font-family:var(--mono);font-size:22px;letter-spacing:.06em;font-weight:700;background:var(--bg-soft);border-radius:12px;padding:14px;text-align:center;user-select:all;word-break:break-all}
.auth-steps{display:grid;gap:14px;margin:4px 0 18px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--label);color:var(--bg);padding:11px 20px;border-radius:999px;z-index:120;font-size:15px;font-weight:500;box-shadow:var(--shadow-pop);max-width:calc(100vw - 32px);text-align:center;animation:fade .15s ease}
@media (min-width:901px){.toast{bottom:32px}}
.loading{display:grid;place-items:center;min-height:60vh;color:var(--label-2)}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--sep-strong);border-top-color:var(--accent);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.muted{color:var(--label-2)}
.sp{height:10px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* ---- Roles, categorías y lista de verificación ---- */
.cwrap{display:grid;gap:8px;align-content:start}
.cat-tools{display:flex;gap:8px;flex-wrap:wrap}
.chkl{margin-top:14px;padding:14px;border:1px solid var(--sep);border-radius:14px;background:var(--bg-soft)}
.chkl-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.bar{height:8px;border-radius:99px;background:var(--sep);overflow:hidden;margin-bottom:10px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .25s}
.chkgrp{display:grid;gap:6px;margin:10px 0}
.chkgrp>b{font-size:14px}
.rolhelp{display:grid;gap:6px;margin:10px 0 0;padding:0;list-style:none;font-size:13.5px;color:var(--label-2)}
.rolhelp b{color:var(--label)}
.auth-alt{margin-top:10px}
.chk-item .dot.bad{background:var(--bad-soft);color:var(--bad)}
.qa-log{display:grid;gap:8px;margin-top:10px}
.qa-log details{border:1px solid var(--sep);border-radius:12px;padding:10px 12px;background:var(--bg-soft);font-size:14px}
.qa-log pre{white-space:pre-wrap;word-break:break-word;margin:8px 0 0;font-size:12.5px}

const MESES = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
const DIAS = ["domingo", "lunes", "martes", "miércoles", "jueves", "viernes", "sábado"];
const parseISO = (iso) => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || ""); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; };
const fmtFecha = (iso) => { const d = parseISO(iso); return d ? `${d.getDate()} de ${MESES[d.getMonth()]} de ${d.getFullYear()}` : "—"; };
const hace = (iso) => {
  const d = parseISO(iso); if (!d) return "";
  const dias = Math.round((Date.now() - d.getTime()) / 864e5);
  if (dias <= 0) return "hoy"; if (dias === 1) return "ayer";
  if (dias < 30) return `hace ${dias} días`;
  if (dias < 365) { const m = Math.max(1, Math.round(dias / 30)); return `hace ${m} ${m === 1 ? "mes" : "meses"}`; }
  const a = Math.round(dias / 365); return `hace ${a} ${a === 1 ? "año" : "años"}`;
};
const bytes = (n) => n < 1024 ? n + " B" : n < 1048576 ? (n / 1024).toFixed(0) + " KB" : (n / 1048576).toFixed(1) + " MB";

function migrar(c) {

  const out = { formato: 2, editado: !!c.editado, actualizado: c.actualizado || hoyISO(), config: Object.assign({}, CONFIG_BASE, c.config || {}) };
  /* Logo por defecto: huella LED vectorial, sin fondo. Si el catálogo guardado aún trae el logo antiguo (imagen incrustada) o los valores de fábrica anteriores, se sustituye. */
  if (out.config.logo === LOGO_PROPIO) out.config.logo = "";
  if (!imgOk(out.config.logo) && out.config.logoMarca === "nodos" && out.config.logoForma === "cuadrado") { out.config.logoMarca = "huella"; out.config.logoForma = "libre"; }
  out.usuarios = Array.isArray(c.usuarios) ? c.usuarios.filter((u) => u && (u.correo || u.rfc) && u.hash).map((u) => Object.assign({}, u, { rol: rolDe(u.rol) })) : [];
  out.avisos = Array.isArray(c.avisos) ? c.avisos.filter((a) => a && a.id).slice(0, 300) : [];
  out.notificaciones = Array.isArray(c.notificaciones) ? c.notificaciones.filter((n) => n && n.id).slice(0, 200) : [];
  out.categorias = Array.isArray(c.categorias)
    ? [...base.categorias.filter((bc) => !c.categorias.some((cc) => cc && cc.id === bc.id)), ...c.categorias]
    : base.categorias;
  out.sistemas = (Array.isArray(c.sistemas) ? c.sistemas : []).map((s) => {
    const b = sistemaBase({});
    const r = Object.assign(b, s, { id: s.id || uid("sis") });
    r.icono = Object.assign({ glifo: "app", color: "azul", imagen: "" }, s.icono || {});
    r.contacto = Object.assign({ correo: "", telefono: "" }, s.contacto || {});
    ["categorias", "usos", "requisitos", "pasos", "enlaces", "tecnica", "dependencias", "novedades", "capturas", "archivos"].forEach((k) => { if (!Array.isArray(r[k])) r[k] = []; });
    return r;
  });
  const categoriaPorSistema = {
    "sis-votaciones": "votaciones-elecciones",
    "sis-elecciones": "votaciones-elecciones",
    "sis-minuta": "reuniones",
    "sis-denuncias-etica": "etica-denuncias",

}

/* ---------- Persistencia (IndexedDB, con respaldo en memoria) ---------- */
const IDB = {
  db: null,
  open() {
    return new Promise((res) => {
      try {
        const r = indexedDB.open("catalogo-sistemas", 1);
        r.onupgradeneeded = () => r.result.createObjectStore("kv");
        r.onsuccess = () => { this.db = r.result; res(true); };
        r.onerror = () => res(false); r.onblocked = () => res(false);
      } catch (e) { res(false); }
    });
  },
  get(k) {
    return new Promise((res) => {
      if (!this.db) return res(undefined);
      try { const q = this.db.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(undefined); } catch (e) { res(undefined); }
    });
  },
  set(k, v) {
    return new Promise((res) => {
      if (!this.db) return res(false);
      try { const t = this.db.transaction("kv", "readwrite"); t.objectStore("kv").put(v, k); t.oncomplete = () => res(true); t.onerror = () => res(false); t.onabort = () => res(false); } catch (e) { res(false); }
    });
  },
  del(k) {
    return new Promise((res) => {
      if (!this.db) return res(false);
      try { const t = this.db.transaction("kv", "readwrite"); t.objectStore("kv").delete(k); t.oncomplete = () => res(true); t.onerror = () => res(false); } catch (e) { res(false); }
    });
  }
};

function toast(msg) {
  $$(".toast", layer).forEach((t) => t.remove());
  const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); t.textContent = msg; layer.appendChild(t);
  clearTimeout(toast._t); toast._t = setTimeout(() => t.remove(), 3400);
}
async function copiar(texto, msg = "Copiado") {
  try { await navigator.clipboard.writeText(texto); toast(msg); return; } catch (e) { /* respaldo */ }
  const ta = document.createElement("textarea"); ta.value = texto; ta.setAttribute("readonly", ""); ta.style.cssText = "position:fixed;opacity:0;top:0;left:0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); toast(msg); } catch (e) { toast("Selecciona el texto y cópialo manualmente."); }
  ta.remove();
}

let modalPrev = null, modalOnClose = null, confFin = null;
function modal({ titulo, body, pie = "", wide = false, onclose = null }) {
  cerrarModal();
  modalPrev = document.activeElement; modalOnClose = onclose;
  const m = document.createElement("div"); m.className = "modal"; m.id = "modal";
  m.innerHTML = `<div class="sheet ${wide ? "wide" : ""}" role="dialog" aria-modal="true" aria-labelledby="mt"><header><h2 id="mt">${esc(titulo)}</h2><button class="iconbtn" data-act="cerrar-modal" aria-label="Cerrar">${glifo("x")}</button></header><div class="body">${body}</div>${pie ? `<footer>${pie}</footer>` : ""}</div>`;
  m.addEventListener("mousedown", (e) => { if (e.target === m) cerrarModal(); });
  layer.appendChild(m);
  const f = $("input,textarea,select", m) || $(".sheet footer .btn:last-child", m) || $(".iconbtn", m);
  if (f) f.focus();
}
function cerrarModal() {
  const m = $("#modal"); if (!m) return;
  m.remove();
  const cb = modalOnClose; modalOnClose = null; if (cb) cb();
  try { if (modalPrev && modalPrev.focus) modalPrev.focus(); } catch (e) {}
}
function confirmar({ titulo, texto, si = "Aceptar", peligro = false }) {
  return new Promise((res) => {
    let hecho = false;
    confFin = (v) => { if (hecho) return; hecho = true; confFin = null; cerrarModal(); res(v); };
    modal({
      titulo, body: `<p class="muted">${esc(texto)}</p>`,
      pie: `<button class="btn sec" data-act="conf-no">Cancelar</button><button class="btn ${peligro ? "danger" : ""}" data-act="conf-si">${esc(si)}</button>`,
      onclose: () => { if (!hecho) { hecho = true; confFin = null; res(false); } }
    });
  });
}

/* ---------- Texto enriquecido (párrafos, viñetas, **negritas**, enlaces) ---------- */
const inline = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/(https?:\/\/[^\s<]*[^\s<.,;:!?)&])/g, (u) => `<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`);
function rich(t) {
  const lines = String(t || "").replace(/\r/g, "").split("\n");
  let out = "", lista = false, par = [];
  const fp = () => { if (par.length) { out += "<p>" + par.map(inline).join("<br>") + "</p>"; par = []; } };
  const fl = () => { if (lista) { out += "</ul>"; lista = false; } };
  for (const l of lines) {
    const m = /^\s*[-•*]\s+(.*)$/.exec(l);
    if (m) { fp(); if (!lista) { out += "<ul>"; lista = true; } out += "<li>" + inline(m[1]) + "</li>"; }
    else if (!l.trim()) { fp(); fl(); }
    else { fl(); par.push(l); }
  }
  fp(); fl(); return out;
}

async function iniciarSesion() {
  if (SB_ON) return sbLogin();
  const correo = normCorreo(val("a-correo")), pass = $("#a-pass").value, rec = $("#a-rec") && $("#a-rec").checked;
  authErr("");
  const fl = []; if (!correoOk(correo)) fl.push(["a-correo", "Escribe un correo electrónico válido."]); if (!pass) fl.push(["a-pass", "Escribe tu contraseña."]);
  if (fl.length) return marcarFaltantes(fl);
  const it = intentosDe(correo);
  if (it.hasta > Date.now()) return authErr(`Demasiados intentos. Vuelve a intentar en ${Math.ceil((it.hasta - Date.now()) / 60000)} min.`);
  const u = buscarPorCorreo(correo);
  const ok = !!u && (await hashClave(pass, u.salt)) === u.hash;
  if (!ok) {
    const n = (it.hasta && it.hasta <= Date.now() ? 0 : it.n) + 1;
    setIntentos(correo, n >= 5 ? { n: 0, hasta: Date.now() + 5 * 60000 } : { n, hasta: 0 });
    return authErr(n >= 5 ? "Demasiados intentos. Espera 5 minutos o solicita recuperar tu contraseña." : "Correo o contraseña incorrectos.");
  }
  if (u.estado === "bloqueado") return authErr("Tu usuario está bloqueado. Contacta al administrador.");
  setIntentos(correo, null); abrirSesion(u, rec);
}

async function cambiarMiClave() {
  const u = S.user, a = $("#pw0").value, n = $("#pw1").value, n2 = $("#pw2").value, er = $("#pw-err");
  if (SB_ON && u.sb) {
    if (!claveOk(n)) { er.textContent = CLAVE_AYUDA; return; }
    if (n !== n2) { er.textContent = "Las contraseñas nuevas no coinciden."; return; }
    const { error: e1 } = await SB.auth.signInWithPassword({ email: u.correo, password: a });
    if (e1) { er.textContent = "La contraseña actual no es correcta."; return; }
    const { error: e2 } = await SB.auth.updateUser({ password: n });
    if (e2) { er.textContent = /same|different/i.test(e2.message) ? "La nueva contraseña debe ser distinta a la actual." : "No se pudo actualizar. Inténtalo de nuevo."; return; }
    cerrarModal(); toast("Contraseña actualizada"); return;
  }
  if ((await hashClave(a, u.salt)) !== u.hash) { er.textContent = "La contraseña actual no es correcta."; return; }
  if (!claveOk(n)) { er.textContent = CLAVE_AYUDA; return; }
  if (normCorreo(n) === normCorreo(u.correo)) { er.textContent = "La contraseña no puede ser tu correo."; return; }
  if (n !== n2) { er.textContent = "Las contraseñas nuevas no coinciden."; return; }
  u.salt = nuevoSalt(); u.hash = await hashClave(n, u.salt); guardarCatalogo(); cerrarModal(); toast("Contraseña actualizada");
}

function buscar(q) {
  const tk = norm(q).split(/\s+/).filter(Boolean);
  if (!tk.length) return [];
  return vis().map((s) => {
    const nombre = norm(s.nombre + " " + s.subtitulo);
    const resto = norm([s.descripcion, s.usos.join(" "), s.area, s.plataforma, s.categorias.map((c) => (catById(c) || {}).nombre || "").join(" "), s.dependencias.map((d) => d.nombre).join(" ")].join(" "));
    let p = 0;
    for (const t of tk) { if (nombre.includes(t)) p += 5; else if (resto.includes(t)) p += 1; else return null; }
    return { s, p };
  }).filter(Boolean).sort((a, b) => b.p - a.p).map((o) => o.s);
}

/* ---------- Ficha del sistema ---------- */
function tipoArchivo(a) {
  const n = norm(a.nombre || ""), t = (a.tipo || "").toLowerCase(), x = n + " " + t;
  if (/pdf/.test(x)) return ["pdf", "PDF"];
  if (/^image\//.test(t)) return ["img", ""];
  if (/\.(docx?|odt)\b|word/.test(x)) return ["doc", "DOC"];
  if (/\.(xlsx?|csv|ods)\b|sheet|excel/.test(x)) return ["xls", "XLS"];
  if (/\.(pptx?)\b|presentation|powerpoint/.test(x)) return ["doc", "PPT"];
  if (/\.zip\b|zip|compressed/.test(x)) return ["zip", "ZIP"];
  return ["", (n.split(".").pop() || "ARCH").toUpperCase().slice(0, 4)];
}
function dataToBlob(d) {
  const m = /^data:([^;,]*)(;base64)?,([\s\S]*)$/.exec(d || ""); if (!m) return null;
  const bin = m[2] ? atob(m[3]) : decodeURIComponent(m[3]);
  const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return new Blob([u], { type: m[1] || "application/octet-stream" });
}
const hostDe = (u) => { try { return new URL(u).host.replace(/^www\./, ""); } catch (e) { return u; } };

function pasosSigue(c) {
  c = c || cfg();
  const auto = !!(c.endpoint || "").trim(), dest = (c.correoDestino || "").trim();
  return [
    ["Envías el formulario", "Se genera un folio con el formato SOL-AAAAMMDD-XXXX y la solicitud queda guardada en «Mis solicitudes» de este dispositivo."],
    auto ? ["Llega al área responsable", "Tu solicitud se envía automáticamente; no tienes que hacer nada más."]
         : ["Llega al área responsable", dest ? `Se envía automáticamente a ${dest}. Si no se pudiera, se abre tu aplicación de correo con el mensaje ya redactado: solo presiona «Enviar».` : "Se envía automáticamente al área responsable. Si no se pudiera, se abre tu aplicación de correo con el mensaje ya redactado."],
    ["Revisamos tu solicitud", `Validamos disponibilidad y requisitos. Te respondemos en ${(c.tiempoRespuesta || "").trim() || "unos días hábiles"} al correo que registraste.`],
    ["Siguiente paso", (c.reunion || "").trim() || "Coordinamos una reunión con tu dependencia para definir accesos y fechas de uso."]
  ];
}

/* ---------- Carga de imágenes y archivos ---------- */
const leer = (f) => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = () => no(r.error); r.readAsDataURL(f); });
async function imagen(file, max, mime) {
  if (/svg|gif/.test(file.type)) return leer(file);
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = url; });
    const k = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement("canvas"); c.width = Math.max(1, Math.round(img.width * k)); c.height = Math.max(1, Math.round(img.height * k));
    const x = c.getContext("2d"); if (mime === "image/jpeg") { x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); }
    x.drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL(mime, 0.86);
  } finally { URL.revokeObjectURL(url); }
}
const draftActual = () => { const [a, b, c] = hashParts(); return a === "admin" && b === "editar" ? S.drafts[c] : null; };

async function subirArchivos(kind, files) {
  const dr = draftActual();
  if (!dr && kind !== "logo") return;
  for (const f of files) {
    try {
      if (kind === "icono") { if (!/^image\//.test(f.type)) { toast("El icono debe ser una imagen."); continue; } dr.s.icono.imagen = await imagen(f, 512, "image/png"); }
      else if (kind === "portada") { if (!/^image\//.test(f.type)) { toast("La portada debe ser una imagen."); continue; } dr.s.portada = await imagen(f, 1600, "image/jpeg"); }
      else if (kind === "captura") { if (!/^image\//.test(f.type)) { toast(`«${f.name}» no es una imagen.`); continue; } dr.s.capturas.push({ src: await imagen(f, 1600, "image/jpeg"), pie: "" }); }
      else if (kind === "archivo") {
        if (f.size > LIMITE_ARCHIVO) { toast(`«${f.name}» pesa más de ${bytes(LIMITE_ARCHIVO)}.`); continue; }
        dr.s.archivos.push({ id: uid("arc"), nombre: f.name, tipo: f.type || "", tamano: f.size, categoria: /\.pdf$/i.test(f.name) ? "Manual" : "Otro", descripcion: "", data: await leer(f) });
      }
      else if (kind === "logo") { if (!/^image\//.test(f.type)) { toast("El logotipo debe ser una imagen."); continue; } S.cfgDraft.logo = await imagen(f, 256, "image/png"); }
      if (dr) dr.dirty = true;
    } catch (e) { toast(`No se pudo leer «${f.name}».`); }
  }
  keep(() => render(false));
}

async function sbSuperEnviar() {

  if (r.error || !r.data || !r.data.user) { libre(); return authErr("Código incorrecto o vencido. Pide uno nuevo con «Reenviar código»."); }

/* ---------- Flechas de carrusel ---------- */
.sx{position:relative;min-width:0}
.sx::before,.sx::after{content:"";position:absolute;top:0;bottom:0;width:30px;z-index:4;pointer-events:none;opacity:0;transition:opacity .25s}
.sx::before{left:0;background:linear-gradient(90deg,var(--bg),transparent)}
.sx::after{right:0;background:linear-gradient(270deg,var(--bg),transparent)}
.sx.sx-bleed::before{left:calc(-1*var(--gutter));width:calc(var(--gutter) + 26px)}
.sx.sx-bleed::after{right:calc(-1*var(--gutter));width:calc(var(--gutter) + 26px)}
.sx.fl::before,.sx.fr::after{opacity:1}
.sx-b{position:absolute;top:50%;z-index:5;width:30px;height:30px;margin-top:-15px;padding:0;border-radius:50%;display:grid;place-items:center;cursor:pointer;
  color:var(--label);background:rgba(255,255,255,.55);border:1px solid rgba(120,140,160,.35);
  -webkit-backdrop-filter:blur(6px) saturate(160%);backdrop-filter:blur(6px) saturate(160%);
  box-shadow:0 2px 8px rgba(20,40,60,.14);opacity:0;pointer-events:none;transition:opacity .2s,background .15s,transform .15s}
.sx-b::after{content:"";position:absolute;inset:-7px}
.sx-b.on{opacity:.85;pointer-events:auto}
.sx-b:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sx-b svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.sx-l{left:6px}.sx-r{right:6px}
.sx-l svg{transform:scaleX(-1)}
/* Laptop (mouse): sutiles en reposo, claras al pasar el cursor */
@media (hover:hover) and (pointer:fine){
  .sx-b.on{opacity:.4}
  .sx:hover .sx-b.on,.sx-b.on:focus-visible{opacity:1}
  .sx-b.on:hover{background:rgba(255,255,255,.92);transform:scale(1.1)}
}
/* Celular (táctil): pista al inicio y se ocultan tras el primer deslizamiento; área de toque ~44px */
@media (hover:none),(pointer:coarse){
  .sx-b{width:28px;height:28px;margin-top:-14px}
  .sx-b svg{width:15px;height:15px}
  .sx-b::after{inset:-8px}
  html.sx-seen .sx-b{opacity:0!important;pointer-events:none!important}
}
@media (prefers-reduced-motion:reduce){.sx-b,.sx::before,.sx::after{transition:none!important}}

<script>
/* Flechas translúcidas en carruseles horizontales */
(function(){
  var SEL=".chips,.hscroll,.rows.paged,.gallery,.revs,.stats";
  var ICON='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>';
  var root=document.documentElement;
  try{if(localStorage.getItem("sx-seen")==="1")root.classList.add("sx-seen")}catch(e){}
  function seen(){
    if(root.classList.contains("sx-seen"))return;
    root.classList.add("sx-seen");
    try{localStorage.setItem("sx-seen","1")}catch(e){}
  }
  function mk(cls,label){var b=document.createElement("button");b.type="button";b.className="sx-b "+cls;b.setAttribute("aria-label",label);b.innerHTML=ICON;return b}
  function setup(el){
    if(el.dataset.sx)return; el.dataset.sx="1";
    var par=el.parentNode, w=document.createElement("div");
    w.className="sx"+(el.classList.contains("bleed")?" sx-bleed":"");
    if(getComputedStyle(par).display.indexOf("flex")>-1){w.style.flex=getComputedStyle(el).flex;}
    par.insertBefore(w,el); w.appendChild(el);
    var isChips=el.classList.contains("chips");
    var l=mk("sx-l",isChips?"Categoría anterior":"Ver anteriores"), r=mk("sx-r",isChips?"Siguiente categoría":"Ver más");
    w.appendChild(l); w.appendChild(r);
    function center(){
      var t=el.querySelector(".feat-card,.shot,.chip,.rev,.stat"), wr=w.getBoundingClientRect(), y;
      if(t){var tr=t.getBoundingClientRect(); y=tr.top-wr.top+tr.height/2}
      else{var er=el.getBoundingClientRect(); y=er.top-wr.top+er.height/2}
      if(y>0){l.style.top=r.style.top=y+"px"}
    }
    function upd(){
      center();
      var max=el.scrollWidth-el.clientWidth, x=Math.abs(el.scrollLeft);
      var cl=max>4&&x>4, cr=max>4&&x<max-4;
      l.classList.toggle("on",cl); r.classList.toggle("on",cr);
      w.classList.toggle("fl",cl); w.classList.toggle("fr",cr);
    }
    function step(){
      if(isChips){var c=el.querySelector(".chip");if(c){var g=parseFloat(getComputedStyle(el).columnGap)||10;return c.offsetWidth+g}}
      return Math.max(160,el.clientWidth*.8);
    }
    function go(d){el.scrollBy({left:d*step(),behavior:"smooth"})}
    l.addEventListener("click",function(){go(-1)}); r.addEventListener("click",function(){go(1)});
    var x0=el.scrollLeft;
    el.addEventListener("scroll",function(){
      upd();
      if(Math.abs(el.scrollLeft-x0)>8&&window.matchMedia("(hover:none),(pointer:coarse)").matches)seen();
    },{passive:true});
    /* Shift + rueda: desplazar de lado */
    el.addEventListener("wheel",function(e){
      if(e.shiftKey&&Math.abs(e.deltaY)>Math.abs(e.deltaX)&&el.scrollWidth>el.clientWidth){e.preventDefault();el.scrollLeft+=e.deltaY}
    },{passive:false});
    /* Teclado: ← → desplazan el carrusel */
    w.addEventListener("keydown",function(e){
      if(e.key!=="ArrowLeft"&&e.key!=="ArrowRight")return;
      var t=e.target; if(t.closest&&t.closest("input,select,textarea,[contenteditable]"))return;
      if(el.scrollWidth<=el.clientWidth)return;
      e.preventDefault(); go(e.key==="ArrowRight"?1:-1);
    });
    if(window.ResizeObserver){var ro=new ResizeObserver(upd);ro.observe(el);Array.prototype.forEach.call(el.children,function(c){ro.observe(c)})}
    window.addEventListener("resize",upd); el.addEventListener("load",upd,true);
    upd(); setTimeout(upd,400);
  }
  function scan(){document.querySelectorAll(SEL).forEach(setup)}
  var t; function later(){cancelAnimationFrame(t);t=requestAnimationFrame(scan)}
  function init(){scan(); new MutationObserver(later).observe(document.body,{childList:true,subtree:true})}
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init);else init();
})();
</script>
